spring.application.name=invoice-demo

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:invoice_demo}
spring.datasource.username=${DB_USERNAME:inv_dba}
spring.datasource.password=${DB_PASSWORD:inv_dba_passwd}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.security.user.name=admin
spring.security.user.password=${APP_ADMIN_PASSWORD:admin}
app.jwt.secret=${JWT_SECRET:local-invoice-demo-secret-32-bytes-minimum!!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

server.port=${PORT:8080}
server.address=0.0.0.0