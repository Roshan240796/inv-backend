spring.application.name=invoice-demo

spring.datasource.url=jdbc:postgresql://localhost:5432/invoice_demo
spring.datasource.username=${DB_USERNAME:inv_dba}
spring.datasource.password=${DB_PASSWORD:inv_dba_passwd}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.security.user.name=admin
spring.security.user.password=${APP_ADMIN_PASSWORD:admin}

server.port=8080
server.address=0.0.0.0