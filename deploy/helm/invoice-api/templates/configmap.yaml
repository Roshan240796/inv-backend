apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "invoice-api.fullname" . }}-config
  labels:
    {{- include "invoice-api.labels" . | nindent 4 }}
data:
  DB_HOST: {{ include "invoice-api.fullname" . }}-postgres
  DB_PORT: "5432"
  DB_NAME: {{ .Values.postgres.database | quote }}
  DB_USERNAME: {{ .Values.postgres.username | quote }}
  PORT: "8080"
